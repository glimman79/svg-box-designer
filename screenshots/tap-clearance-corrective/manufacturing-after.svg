<svg xmlns="http://www.w3.org/2000/svg" width="360" height="600"><rect width="360" height="600" fill="#182235"/><text x="25" y="38" fill="white" font-family="sans-serif" font-size="20" font-weight="700">Manufacturing settings</text><text x="35" y="75" fill="#d1d5db" font-family="sans-serif" font-size="14">Kerf</text><rect x="35" y="85" width="280" height="38" rx="5" fill="#111827" stroke="#4b5563"/><text x="48" y="110" fill="white" font-family="sans-serif" font-size="15">0.15</text><text x="35" y="150" fill="#d1d5db" font-family="sans-serif" font-size="14">Tap Clearance</text><rect x="35" y="160" width="280" height="38" rx="5" fill="#111827" stroke="#4b5563"/><text x="48" y="185" fill="white" font-family="sans-serif" font-size="15">-0.10</text><text x="35" y="225" fill="#d1d5db" font-family="sans-serif" font-size="14">Slot Clearance</text><rect x="35" y="235" width="280" height="38" rx="5" fill="#111827" stroke="#4b5563"/><text x="48" y="260" fill="white" font-family="sans-serif" font-size="15">-0.10</text><text x="35" y="300" fill="#9ca3af" font-family="sans-serif" font-size="12">Kerf applies globally to the whole generated output.</text><text x="35" y="321" fill="#9ca3af" font-family="sans-serif" font-size="12">Tap Clearance applies automatically to all generator-authored male taps.</text><text x="35" y="342" fill="#9ca3af" font-family="sans-serif" font-size="12">Slot clearance applies only to S-generated slot contours before Kerf.</text><rect x="25" y="365" width="300" height="105" rx="7" fill="#273449" stroke="#526177"/><text x="40" y="393" fill="white" font-family="sans-serif" font-size="17" font-weight="700">Profile Offset</text><text x="40" y="414" fill="#9ca3af" font-family="sans-serif" font-size="12">Apply an offset to selected profiles.</text></svg>